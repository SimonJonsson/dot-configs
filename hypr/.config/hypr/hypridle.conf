# Hypridle config — desktop running services 24/7, no sleep, no lock.
# Screen turns off via DPMS after inactivity but a periodic poke keeps the
# NVIDIA GPU from idling too long and hitting GSP firmware crashes (Xid 62/119).

general {
    lock_cmd = omarchy-lock-screen                         # lock screen and 1password (manual only)
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Keyboard backlight off after 5.5 min of inactivity
listener {
    timeout = 330                                            # 5.5min
    on-timeout = brightnessctl -sd '*::kbd_backlight' set 0  # turn off keyboard backlight
    on-resume = brightnessctl -rd '*::kbd_backlight'         # restore keyboard backlight
}

# Screen off after 10 min — longer timeout to reduce DPMS transitions.
# Periodic GPU poke via systemd timer prevents prolonged idle GSP crashes.
listener {
    timeout = 600                                            # 10min
    on-timeout = hyprctl dispatch dpms off                   # screen off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r # screen on when activity detected
}
