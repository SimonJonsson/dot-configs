general.import = ["~/.config/alacritty/themes/tokyonight/tokyonight_storm.toml"]

[env]
TERM = "xterm-256color"

[font]
normal = { family = "CaskaydiaMono Nerd Font", style = "Regular" }
bold = { family = "CaskaydiaMono Nerd Font", style = "Bold" }
italic = { family = "CaskaydiaMono Nerd Font", style = "Italic" }
size = 12

[window]
# Left Option = Alt (herdr chords); right Option untouched so GO60 AltGr
# combos (a+e etc.) compose åäö via the U.S. Swedish AltGr layout.
option_as_alt = "OnlyLeft"
padding.x = 14
padding.y = 14
decorations = "None"
opacity = 0.9
blur = true

[keyboard]
bindings = [
    { key = "Insert", mods = "Shift", action = "Paste" },
    { key = "Insert", mods = "Control", action = "Copy" },
    { key = "Return", mods = "Shift", chars = "\u001B\r" },
]

[terminal.shell]
program = "/opt/homebrew/bin/fish"
args = ["-l", "-c", "tmux attach || tmux -2"]

[terminal]
osc52 = "CopyPaste"
