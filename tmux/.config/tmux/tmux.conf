# Entry point. Keep this file thin: the Omarchy config is the base, and
# everything personal lives in personal.conf.
#
# On Omarchy we source the *live* system config, so `omarchy update` flows
# through automatically. Elsewhere (macOS) we fall back to omarchy.conf, a
# verbatim copy of that same file, so the look, feel and keybindings match.
#
# Re-sync the copy after an Omarchy update with:
#   diff /usr/share/omarchy/config/tmux/tmux.conf ~/.config/tmux/omarchy.conf

if-shell '[ -r /usr/share/omarchy/config/tmux/tmux.conf ]' \
  'source-file /usr/share/omarchy/config/tmux/tmux.conf' \
  'source-file ~/.config/tmux/omarchy.conf'

source-file ~/.config/tmux/personal.conf
