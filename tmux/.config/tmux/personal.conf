# Personal layer, applied on top of the Omarchy base. Nothing here should
# restyle the status bar: Omarchy's is deliberately palette-free so tmux
# follows `omarchy theme set`.

# Free C-Space for nvim (blink.cmp trigger): C-b is already prefix2, so make
# it the only prefix and drop Omarchy's C-Space prefix/send bindings.
set -g prefix C-b
unbind C-Space

# Plugins. tpm lives beside this file, so the same XDG path works on macOS.
set -g @plugin 'tmux-plugins/tpm'

# Space-leader style popup menu of bindings (prefix + Space).
set -g @plugin 'alexwforsythe/tmux-which-key'

# Move between tmux panes and nvim splits with the same Ctrl + hjkl.
# Omarchy's own C-M-arrow pane bindings still work alongside these.
set -g @plugin 'christoomey/vim-tmux-navigator'

# Persist sessions across reboots and restore them automatically.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# The navigator claims C-l at the root level, so keep a way to clear a pane.
# It rebinds prefix+C-l itself without a description, which would clobber the
# annotated bind below and leave a bare "send-keys C-l" in the keybindings
# popup, so turn its version off.
set -g @vim_navigator_prefix_mapping_clear_screen ''
bind -N "Clear screen" C-l send-keys C-l

# omarchy-menu-tmux-keybindings only exists on Omarchy; fall back elsewhere.
if-shell '! command -v omarchy-menu-tmux-keybindings >/dev/null 2>&1' \
  'bind -N "Show Tmux keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "tmux list-keys -N | sort | less -R"'

# Keep last: tpm must load after the plugin list is declared.
run '~/.config/tmux/plugins/tpm/tpm'
